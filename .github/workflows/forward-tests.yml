name: Forward regression tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt ruff
      - run: python -m unittest discover -s tests -v
      - run: node tests/forward_render.test.cjs
      - run: node --check web/static/js/main.js
      - run: npm ci
        if: matrix.python-version == '3.12'
      - run: npx playwright install --with-deps chromium
        if: matrix.python-version == '3.12'
      - run: npm run test:browser
        if: matrix.python-version == '3.12'
      - run: python -m compileall -q .
      - run: ruff check --select E9,F63,F7,F82 archive_management.py db_config.py serializer.py forward_archive.py main.py web/server.py contrib/archive_migrate.py contrib/cache_reference_preview.py tests
